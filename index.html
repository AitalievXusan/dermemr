<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DermEMR — Прием дерматолога</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- шрифты не блокируют первую отрисовку: страница показывается сразу, шрифты подгружаются следом -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      .boot { min-height: 100vh; display: grid; place-items: center; font: 16px/1.4 system-ui, sans-serif; color: #6b6259; background: #f7f4ef; }
      .boot b { display: block; font: 600 26px Georgia, serif; color: #1f2a24; margin-bottom: 6px; text-align: center; }
      html[data-theme='dark'] .boot { background: #151816; color: #a9a39b; }
      html[data-theme='dark'] .boot b { color: #ece7df; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><div><b>Dermaclinic</b><span id="boot-msg">Загрузка…</span></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# Демо-версия на GitHub Pages: только фронтенд (режим без сервера — демо-визит в браузере).
# Полная версия с сервером, кассой, PDF и мессенджерами запускается локально: start.bat / npm start.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Сборка и публикация разделены на два задания (как в официальном шаблоне GitHub Pages):
  # публикация начинается, когда архив сайта уже полностью зарегистрирован. Если публиковать
  # в том же задании сразу после загрузки, GitHub иногда не успевает его увидеть
  # («No artifacts named github-pages were found»).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx vite build --base "/${{ github.event.repository.name }}/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
